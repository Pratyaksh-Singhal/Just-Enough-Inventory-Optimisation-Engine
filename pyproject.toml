[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-optimization-engine"
version = "0.1.0"
description = "Hierarchical demand forecasting and newsvendor inventory optimization on M5 retail data"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=16.0",
]

[project.optional-dependencies]
# Installed at the phase boundary that needs them, to keep the base env fast.
models = ["lightgbm>=4.3", "scikit-learn>=1.5", "statsforecast>=1.7", "mlflow>=2.14"]
hierarchy = ["hierarchicalforecast>=0.4", "scipy>=1.13"]
api = ["fastapi>=0.111", "uvicorn[standard]>=0.30", "pydantic>=2.7"]
# Tier 2: the backend forecast service. Postgres rather than DuckDB (concurrent writers),
# arq rather than RQ (RQ needs os.fork, which rules out a native Windows worker).
service = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "alembic>=1.13",
    "arq>=0.26",
    "python-multipart>=0.0.9",
    "sentry-sdk[fastapi]>=2.13",
    "posthog>=3.5",
    # Festival dates. Lunar dates typed by hand are a silent-failure risk: a wrong
    # Diwali measures the wrong fortnight and returns a confident ratio for it.
    #
    # Pinned exactly, for the same reason CI pins RUFF_VERSION. This is not an ordinary
    # library dependency: `festivals.SOURCES` matches the *display strings* the library
    # emits ("Eid al-Fitr", "Diwali (Deepavali)"), so a release that renames an entry
    # removes a festival from the calendar rather than changing an API we would notice at
    # import time. `holidays>=0.60` let CI resolve a version whose Indian Islamic holidays
    # are named differently; the calendar came back with no Eid at all and four tests in
    # tests/test_service_festivals.py caught it -- which is the system working, but the
    # failure belongs at upgrade time and on purpose, not on an unrelated push.
    #
    # Upgrading is a deliberate act: raise this pin, run the suite, and read what the
    # coverage test says before believing the new version.
    "holidays==0.102",
]
dev = ["pytest>=8.2", "ruff>=0.5", "shap>=0.45", "httpx>=0.27"]

[project.scripts]
build-warehouse = "inventory_engine.data.loader:main"
build-features = "inventory_engine.features.build:main"
run-baselines = "inventory_engine.models.run_baselines:main"
run-gbm = "inventory_engine.models.run_gbm:main"
run-hybrid = "inventory_engine.models.run_hybrid:main"
run-backtest = "inventory_engine.backtest.run_backtest:main"
run-mint = "inventory_engine.hierarchy.run_mint:main"
run-optimize = "inventory_engine.optimize.run_optimize:main"
run-api = "inventory_engine.api.run_server:main"
run-service = "inventory_engine.service.run_server:main"
run-nightly-refresh = "inventory_engine.api.run_nightly:main"
run-api-bench = "inventory_engine.api.bench:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_engine"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "D"]
ignore = ["D203", "D213"]

[tool.ruff.lint.per-file-ignores]
# Fixture CSVs reproduce the real M5 headers verbatim; wrapping them would
# make them wrong.
"tests/*" = ["D", "E501"]
# FastAPI's dependency injection requires Depends(...) as an argument default -- that is
# the framework's documented API, not the antipattern B008 flags.
"src/inventory_engine/api/*" = ["B008"]
"src/inventory_engine/service/*" = ["B008"]
"src/inventory_engine/service/routers/*" = ["B008"]
# Alembic generates these and owns their shape; reformatting them fights the tool.
"migrations/*" = ["D", "E501", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# `tests` is on the path so test modules can share `synthetic.py`.
pythonpath = ["src", "tests"]
markers = [
    # Tests that actually fit LightGBM. They run by default -- a model pipeline whose
    # end-to-end behaviour is opt-in is a model pipeline nobody checks -- but the marker
    # exists so `-m "not slow"` gives a fast inner loop.
    "slow: fits a real model; seconds rather than milliseconds",
]

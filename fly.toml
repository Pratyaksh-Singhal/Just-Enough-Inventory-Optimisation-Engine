# Fly.io deployment for tier 2 (the upload -> forecast -> order service).

app = "inventory-optimization-engine"
# Singapore, not Mumbai. The instinct is to sit closest to the operator, but the database is the
primary_region = "sin"

[build]
  dockerfile = "Dockerfile"

[deploy]

  release_command = "alembic upgrade head"

[processes]

  app = "bash -c 'arq inventory_engine.service.worker.WorkerSettings & uvicorn inventory_engine.service.app:app --host 0.0.0.0 --port 8001 & wait -n; exit $?'"

[env]

  UPLOAD_DIR = "/data/uploads"
  ENVIRONMENT = "production"

[http_service]
  internal_port = 8001
  force_https = true
  processes = ["app"]

  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = "5s"

[[mounts]]
  source = "uploads"
  destination = "/data/uploads"
  processes = ["app"]


[[vm]]
  size = "shared-cpu-2x"
  memory = "2gb"
  processes = ["app"]
  # 2 vCPU because LightGBM's SMALL_DATA_PARAMS sets num_threads = 2 and uvicorn has to keep

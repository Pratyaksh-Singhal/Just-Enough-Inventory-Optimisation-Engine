# Lint on every push. The test suite is kept out of the repository, so CI cannot run it --
# see .gitignore. What remains is still worth running: ruff catches the import and format
# drift that a local pre-commit habit misses, and it runs in seconds.

name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]
  # Lets a run be retried without an empty commit.
  workflow_dispatch:

# A new push to the same branch makes the previous run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned rather than floating. `ruff format` output changes between releases, so an
  # unpinned CI would fail on a codebase that formats cleanly locally.
  RUFF_VERSION: "0.16.2"
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: ruff (check + format)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Only ruff. Linting does not need LightGBM.
      - run: pip install "ruff==${{ env.RUFF_VERSION }}"

      - name: ruff check
        run: ruff check src migrations scripts

      - name: ruff format --check
        run: ruff format --check src migrations scripts

  page:
    name: dashboard builds and parses
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # The committed page is what gets deployed, so a template edit that was never rebuilt
      # ships the old page and looks like the change simply had no effect. This catches that
      # without needing the warehouse: node parses every inline script, and a page whose
      # JavaScript does not parse is refused rather than written.
      - name: every inline script parses
        run: |
          python - <<'PY'
          import pathlib, re, subprocess, sys, tempfile
          page = pathlib.Path("dashboard/index.html").read_text(encoding="utf-8")
          blocks = re.findall(r"<script>(.*?)</script>", page, re.S)
          assert blocks, "no inline scripts found in the built page"
          with tempfile.TemporaryDirectory() as tmp:
              for i, block in enumerate(blocks):
                  f = pathlib.Path(tmp) / f"b{i}.js"
                  f.write_text(block, encoding="utf-8")
                  done = subprocess.run(["node", "--check", str(f)], capture_output=True, text=True)
                  if done.returncode:
                      sys.exit(f"script block {i} does not parse:\n{done.stderr}")
          print(f"{len(blocks)} script block(s) parse")
          PY

      - name: every element id the page queries exists
        run: |
          python - <<'PY'
          import pathlib, re, sys
          page = pathlib.Path("dashboard/index.html").read_text(encoding="utf-8")
          queried = set(re.findall(r"""[#$]{1,2}\(['"]#([A-Za-z0-9_-]+)['"]\)""", page))
          queried |= set(re.findall(r"""getElementById\(['"]([A-Za-z0-9_-]+)['"]\)""", page))
          present = set(re.findall(r'\bid="([A-Za-z0-9_-]+)"', page))
          missing = sorted(queried - present)
          if missing:
              sys.exit(f"queried but never rendered: {missing}")
          print(f"{len(queried)} ids all present")
          PY
